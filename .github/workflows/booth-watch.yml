name: BOOTH更新監視

on:
  schedule:
    # 30分ごと（GitHubのcronは混雑時に数分〜30分ほど遅れることがある）
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: booth-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: BOOTHを確認してDiscordに通知
        shell: pwsh
        env:
          BOOTH_WEBHOOK: ${{ secrets.BOOTH_WEBHOOK }}
        run: |
          if (-not $env:BOOTH_WEBHOOK) {
            Write-Host "::error::Secrets に BOOTH_WEBHOOK が設定されていません"
            exit 1
          }
          ./booth-watch.ps1 -Shop bbeyemtkw -StateFile ./state.json

      - name: 状態の変化をコミット
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: BOOTHの状態を更新"
            git push
          else
            echo "変化なし"
          fi
